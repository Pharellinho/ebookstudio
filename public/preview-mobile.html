<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Mobile preview · EbookStudio</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        background: #e5e5e5;
        font-family: system-ui, sans-serif;
      }
      .label {
        margin: 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #737373;
      }
      .phone {
        border: 10px solid #171717;
        border-radius: 32px;
        background: #171717;
        padding: 8px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      }
      iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 0;
        border-radius: 22px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <p class="label">Mobile preview · 390×844</p>
    <div class="phone">
      <iframe title="EbookStudio mobile" src="/"></iframe>
    </div>
  </body>
</html>
